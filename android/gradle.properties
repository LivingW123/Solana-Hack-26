# --- TapTrade app config (override in ~/.gradle/gradle.properties or with -P) ---
# Emulators reach the host machine at 10.0.2.2. On a physical phone use the
# host's LAN IP, e.g. http://192.168.1.20:3000
taptrade.backendUrl=http://10.0.2.2:3000
# true = hardcoded listings/reputation (no backend needed; can't trade).
taptrade.fakeBackend=false
# Chain reads (tx confirmation, escrow websocket) go straight to RPC, never through the backend.
taptrade.rpcUrl=https://api.devnet.solana.com
